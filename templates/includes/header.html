{% load static %}
<header class="site-header">
    <div class="container header-inner">
        <button class="menu-toggle" type="button" aria-label="Відкрити меню" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <a href="{% url 'pages:home' %}" class="logo">T&amp;A CORNER</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="{% url 'pages:home' %}" {% if request.resolver_match.url_name == 'home' %}class="is-active"{% endif %}>Головна</a>
            <a href="{% url 'shop:catalog' %}">Аромати</a>
            <a href="{% url 'pages:about' %}">Про нас</a>
            <a href="{% url 'pages:contact' %}">Контакти</a>
            {% if user.is_authenticated %}
            <div class="mobile-auth-links">
                <a href="{% url 'pages:account' %}" class="mobile-auth-link">Мій кабінет</a>
                <a href="{% url 'pages:logout' %}" class="mobile-auth-link">Вийти</a>
            </div>
            {% else %}
            <div class="mobile-auth-links">
                <a href="{% url 'pages:login' %}" class="mobile-auth-link">Вхід</a>
                <a href="{% url 'pages:register' %}" class="mobile-auth-link">Реєстрація</a>
            </div>
            {% endif %}
        </nav>

        <div class="header-actions">
            <button class="header-search-toggle" type="button" aria-label="Відкрити пошук" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/>
                    <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </button>
            <form method="get" action="{% url 'shop:catalog' %}" class="header-search">
                <label class="sr-only" for="header-search">Пошук ароматів</label>
                <input id="header-search" name="q" type="search" value="{{ request.GET.q|default:'' }}" placeholder="Пошук ароматів" autocomplete="off">
            </form>
            {% if user.is_authenticated %}
            <a href="{% url 'pages:account' %}" class="header-auth-link">Кабінет</a>
            <span class="header-user">{{ user.username }}</span>
            <a href="{% url 'pages:logout' %}" class="header-auth-link">Вийти</a>
            {% else %}
            <a href="{% url 'pages:login' %}" class="header-auth-link">Вхід</a>
            <a href="{% url 'pages:register' %}" class="header-auth-link">Реєстрація</a>
            {% endif %}
            <a href="{% url 'shop:cart_detail' %}" class="cart-btn" aria-label="Кошик">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M6 6h15l-1.5 9h-12L6 6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M6 6 5 3H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="10" cy="19" r="1.5" fill="currentColor"/>
                    <circle cx="17" cy="19" r="1.5" fill="currentColor"/>
                </svg>
                <span class="cart-count" data-cart-count>{{ cart_quantity }}</span>
            </a>
        </div>
    </div>
</header>
